[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-spark-mutator"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5,<3.6",
    "py4j>=0.10.9",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.entry-points.pytest11]
spark_mutator = "pytest_spark_mutator.plugin"

[tool.setuptools.packages.find]
include = ["pytest_spark_mutator*"]

[tool.setuptools.package-data]
pytest_spark_mutator = ["jars/*.jar"]
