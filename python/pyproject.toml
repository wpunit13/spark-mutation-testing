[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-spark-mutation-testing"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    # Supported shim matrix: Spark 3.5.x (latest LTS) and 4.2.x (current GA
    # minor, Scala 2.13-only). See pytest_spark_mutator/version_detect.py.
    "pyspark>=3.5,<4.3",
    "py4j>=0.10.9",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.entry-points.pytest11]
spark_mutator = "pytest_spark_mutator.plugin"

[tool.setuptools.packages.find]
include = ["pytest_spark_mutator*"]

[tool.setuptools.package-data]
pytest_spark_mutator = ["jars/*.jar"]
