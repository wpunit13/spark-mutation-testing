name: Release

# WP-22 v2: tag-triggered publish to Maven Central + PyPI (docs/RELEASING.md).
#
# Tag-stamped model: the tag is the ONLY version decision. The workflow
# stamps the POM and pyproject versions from the tag in the build workspace
# (never committed) — main's dev-marker versions never change.
#
# The trigger glob `v*.*.*` alone is NOT numeric — `v1.0.0-rc1` matches it,
# and Central is immutable. Publication is therefore enforced twice: the
# loose glob here for readability, and a strict regex guard below for
# correctness. Non-matching tags exit 0 (skip, not fail).
#
# workflow_dispatch is the recovery hatch (docs/RELEASING.md §4): a failed
# stage can be re-run independently after a fix landed on main — re-running
# the original run would replay the OLD workflow file. `pypi-only` rebuilds
# the jars from the tagged commit; `maven-only` must never target an
# already-published version (Central is immutable).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z — must match an existing vX.Y.Z tag on main'
        required: true
        type: string
      jobs:
        description: 'Which stages to run'
        type: choice
        default: all
        options: [all, maven-only, pypi-only, smoke-only]

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout (full history — the on-main check needs origin/main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            # Strict numeric guard: the glob `v*.*.*` alone still matches
            # `v1.0.0-rc1`. Non-matching tags skip silently (exit 0).
            if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Tag $GITHUB_REF_NAME is not a numeric release tag (vX.Y.Z) — skipping."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "ERROR: invalid version '$VERSION' (expected X.Y.Z)" >&2
            exit 1
          }
          git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null || {
            echo "ERROR: tag v$VERSION does not exist" >&2
            exit 1
          }
          # Releases are cut from green main only: the tagged commit must be
          # an ancestor of origin/main. (^{commit} peels annotated tags.)
          git merge-base --is-ancestor "refs/tags/v$VERSION^{commit}" origin/main || {
            echo "ERROR: tag v$VERSION does not point at a commit on main — refusing to publish" >&2
            exit 1
          }
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-maven:
    needs: guard
    if: always() && needs.guard.outputs.ok == 'true' &&
        (github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'maven-only')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.guard.outputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Import GPG signing key
        run: |
          echo "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing-key.asc"
          gpg --batch --import "$RUNNER_TEMP/signing-key.asc"
          rm -f "$RUNNER_TEMP/signing-key.asc"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Maven credentials (server id `central`)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      # Tests are NOT re-run here: releases cut only from green main (CI
      # already ran the full matrix on this commit). The version stamp is
      # workspace-only — main's dev-marker version is never committed.
      # Passphrase flows via MAVEN_GPG_PASSPHRASE (the non-deprecated channel;
      # -Dgpg.passphrase leaks into process args).
      - name: Stamp release version and deploy to Maven Central
        run: |
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -Prelease clean deploy -DskipTests
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      # The wheel must embed the SAME jars this run published to Central.
      - name: Upload bundle jars for the PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: interceptor-bundles
          path: |
            catalyst-interceptor/interceptor-bundle/target/interceptor-spark-3.5_2.13.jar
            catalyst-interceptor/interceptor-bundle-2.12/target/interceptor-spark-3.5_2.12.jar
            catalyst-interceptor/interceptor-bundle-4.2/target/interceptor-spark-4.2_2.13.jar
          if-no-files-found: error

  publish-pypi:
    needs: [guard, publish-maven]
    if: always() && needs.guard.outputs.ok == 'true' &&
        ((needs.publish-maven.result == 'success' &&
          (github.event_name == 'push' || inputs.jobs == 'all')) ||
         (github.event_name == 'workflow_dispatch' && inputs.jobs == 'pypi-only'))
    # Must match the PyPI trusted-publisher registration exactly
    # (repo + workflow file + environment) — a mismatch is a 403.
    environment: release
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.guard.outputs.version }}

      - name: Set up JDK 17 (pypi-only recovery rebuilds the jars from source)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download bundle jars from the Maven job
        if: github.event_name == 'push' || inputs.jobs == 'all'
        uses: actions/download-artifact@v4
        with:
          name: interceptor-bundles
          # upload-artifact strips the common ancestor (catalyst-interceptor/)
          # from the zip; extracting here restores the bundle_jars.py glob paths
          path: catalyst-interceptor

      - name: Rebuild bundle jars from the tagged source (pypi-only recovery)
        if: github.event_name == 'workflow_dispatch' && inputs.jobs == 'pypi-only'
        run: mvn -B -q clean install -DskipTests

      - name: Stamp wheel version from tag
        run: |
          VERSION="${{ needs.guard.outputs.version }}"
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"$VERSION"'"/' python/pyproject.toml
          rm -f python/pyproject.toml.bak
          grep "^version" python/pyproject.toml

      - name: Bundle jars into the wheel
        run: python python/build_hooks/bundle_jars.py

      # Wheel-only: no sdist — building from source needs Maven-built jars.
      - name: Build wheel
        run: |
          pip install build twine
          python -m build --wheel python/
          twine check --strict python/dist/*

      - name: Publish to PyPI (OIDC trusted publishing — no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  smoke-test:
    needs: [guard, publish-maven, publish-pypi]
    if: always() && needs.guard.outputs.ok == 'true' &&
        ((needs.publish-maven.result == 'success' && needs.publish-pypi.result == 'success' &&
          (github.event_name == 'push' || inputs.jobs == 'all')) ||
         inputs.jobs == 'smoke-only')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (verify-release.sh lives in the tagged commit)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.guard.outputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # First release only: the Maven deployment sits in the Central Portal
      # for manual review (autoPublish=false) and Central's CDN sync lags a
      # few minutes even after approval — poll instead of failing fast.
      - name: Install wheel from PyPI and assert bundled jars
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          # PyPI serves an upload quickly but not atomically with the publish
          # job's completion — retry rather than racing the CDN.
          installed=false
          for _ in $(seq 1 10); do
            if pip install "pytest-spark-mutation-testing==$VERSION"; then
              installed=true
              break
            fi
            echo "Not on PyPI yet — waiting 30s..."
            sleep 30
          done
          [ "$installed" = true ] || { echo "ERROR: wheel not installable from PyPI after 5 minutes" >&2; exit 1; }
          python - <<'PY'
          import glob, pytest_spark_mutator
          jars = glob.glob(
              "jars/interceptor-spark-*.jar",
              root_dir=pytest_spark_mutator.__path__[0],
          )
          assert len(jars) >= 2, f"expected bundled jars, found {jars}"
          print("bundled jars:", jars)
          PY

      # The FULL consumer-facing coordinate set, not just two spot checks:
      # the 1.0.0 release published a subset of the modules and the plugin
      # resolved a coordinate that was never published — every downstream
      # consumer's CI-grade path died while this smoke test stayed green on
      # its two-artifact spot check.
      - name: Resolve the full release coordinate set from Maven Central
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if bash scripts/verify-release.sh "$VERSION"; then
              echo "Central resolution OK"
              exit 0
            fi
            echo "Not on Central yet (attempt $_/30) — waiting 60s..."
            sleep 60
          done
          echo "ERROR: release coordinates not resolvable from Central after 30 minutes" >&2
          echo "Known causes: (a) first-release manual review in the Central Portal takes" >&2
          echo "longer than the poll — approve the deployment, then re-run this job alone via" >&2
          echo "workflow_dispatch with inputs.jobs=smoke-only; (b) CDN sync lagging past 30 min —" >&2
          echo "same re-run. The publish itself succeeded; only this verification timed out." >&2
          exit 1
