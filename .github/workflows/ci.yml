name: CI

# Trigger policy: PR runs are the gate (incl. the version-hygiene merge guard
# and the shim matrix); the post-merge main run verifies what actually landed
# ("green main" for releases). Bare branch pushes trigger NOTHING — want CI
# on a branch? Open the PR (draft if not ready).
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Rapid PR updates cancel the superseded in-progress run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WP-20: global checks run ONCE — they are version-independent (the
  # no-spark-imports gate covers every module in the reactor; the version-
  # hygiene guard is a PR-merge guard).
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the version-hygiene guard can compute the merge
          # base against the PR's target branch.
          fetch-depth: 0

      - name: Check no Spark imports in mutator-core
        run: bash scripts/check_no_spark_imports.sh

      # WP-19 version-hygiene merge guard (docs/RELEASING.md Rule 1). PR-only:
      # direct-to-main release/bump commits are not PRs and are unaffected.
      - name: Check version hygiene
        if: github.event_name == 'pull_request'
        run: bash scripts/check_version_hygiene.sh
        env:
          BASE_REF: origin/${{ github.base_ref }}

  # Fast lane (WP-20): single job on every push — full reactor build + full
  # test suite + wheel bundling + Python tests. Bounds routine CI cost while
  # the shim-matrix job below carries the per-version verification.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Bundle jars
        run: python python/build_hooks/bundle_jars.py

      - name: Install Python package and run tests
        run: |
          cd python
          pip install -e '.[dev]'
          python -m pytest -v

  # WP-20 version matrix: one leg per supported Spark/Scala combination. The
  # two key sets (SparkVersionDetector.SUPPORTED_VERSIONS and VERSION_MATRIX)
  # must stay identical — python/tests/test_version_detect.py asserts the
  # parity, so a combination added to one side without the other fails every
  # leg. Trigger policy: pull_request + push to main only, to bound CI cost
  # (the fast lane above covers routine branch pushes).
  shim-matrix:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        combo: ["3.5_2.12", "3.5_2.13", "4.2_2.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build reactor (all shims compile)
        run: mvn -B clean install -DskipTests

      - name: Verify shim ${{ matrix.combo }} tests (goldens)
        run: mvn -B test -pl catalyst-interceptor/interceptor-spark-${{ matrix.combo }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Bundle jars
        run: python python/build_hooks/bundle_jars.py

      - name: Assert ${{ matrix.combo }} jar is bundled
        run: test -f python/pytest_spark_mutator/jars/interceptor-spark-${{ matrix.combo }}.jar

      - name: Install Python package and run tests
        run: |
          cd python
          pip install -e '.[dev]'
          python -m pytest -v

  # Consumer-shaped verification: install the reactor into a FRESH local
  # repository and run a standalone downstream project (no parent POM, no
  # reactor classes) against ONLY those artifacts — the same way a real
  # consumer resolves from Maven Central. In-repo tests run against the
  # reactor and cannot see a partial publish, a missing coordinate, or
  # parent-POM coupling; this job can (the 1.0.0 incident).
  consumer-verification:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install reactor into a fresh local repository
        run: |
          echo "FRESH=$RUNNER_TEMP/m2-consumer" >> "$GITHUB_ENV"
          mvn -B install -DskipTests -Dmaven.repo.local="$RUNNER_TEMP/m2-consumer"

      - name: Resolve the reactor version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Consumer test path (in-process mutation loop)
        run: mvn -B test -f examples/consumer-standalone/pom.xml -Dmaven.repo.local="$FRESH" -Dmutator.version="$VERSION"

      - name: Consumer fork path (plugin mutate, scoped to one class)
        run: mvn -B test-compile io.github.wpunit13:spark-mutation-testing-maven-plugin:"$VERSION":mutate -f examples/consumer-standalone/pom.xml -Dmaven.repo.local="$FRESH" -Dmutator.version="$VERSION" -Dtest=SimpleReadWriteTest
