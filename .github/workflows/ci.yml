name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check no Spark imports in mutator-core
        run: bash scripts/check_no_spark_imports.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Bundle jars
        run: python python/build_hooks/bundle_jars.py

      - name: Install Python package and run tests
        run: |
          cd python
          pip install -e '.[dev]'
          python -m pytest -v
